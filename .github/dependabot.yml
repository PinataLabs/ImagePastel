version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns:
          - "*"
    ignore:
      # Held at 1.2.x: 1.3 adds rules the code base does not follow yet.
      - dependency-name: StyleCop.Analyzers
        versions:
          - ">= 1.3.0"

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
