name: "Bug report"
description: Report a bug in PinataLabs.ImagePastel.
labels: ["needs triage"]
body:
- type: checkboxes
  attributes:
    label: Prerequisites
    options:
      - label: The issue title describes the bug.
        required: true
      - label: I use the latest version of PinataLabs.ImagePastel.
        required: true
      - label: I tested the bug in both `Debug` and `Release` builds.
        required: true
      - label: I searched the [open](https://github.com/PinataLabs/ImagePastel/issues) and [closed](https://github.com/PinataLabs/ImagePastel/issues?q=is%3Aissue+is%3Aclosed) issues, and no issue reports this bug.
        required: true
- type: input
  attributes:
    label: PinataLabs.ImagePastel version
  validations:
    required: true
- type: input
  attributes:
    label: Environment (operating system and version)
  validations:
    required: true
- type: input
  attributes:
    label: .NET version
  validations:
    required: true
- type: textarea
  attributes:
    label: Description
    description: Describe the bug.
  validations:
    required: true
- type: textarea
  attributes:
    label: Steps to reproduce
    description: Give the steps, sample code, a failing test, or a link to a project that shows the bug. Put stack traces in a code block (```).
  validations:
    required: true
- type: textarea
  attributes:
    label: Images
    description: Attach the images that show the bug. If GitHub does not accept the file type, attach the file in a zip archive.
