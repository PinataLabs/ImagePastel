name: CI

# Builds, tests, and checks the public API. Publishing is separate:
# release-publish.yml (stable releases) and release-prerelease.yml (pre-releases)
# both require this workflow to have passed on the commit they publish.
# Changes to Markdown files alone don't run it. To release such a commit, run
# this workflow on it by hand (workflow_dispatch) first.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            coverage: true

    steps:
      - name: Configure Git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer computes the version from tags.
          fetch-depth: 0

      # See https://github.com/actions/checkout/issues/165#issuecomment-657673315
      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}-v1

      - name: Pull LFS files
        run: git lfs pull

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'nuget.config', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Builds net10.0 and netstandard2.1 for the library; tests run on net10.0.
      - name: Build
        run: dotnet build ImageSharp.slnx -c Release -p:codecov=${{ matrix.coverage == true }}

      # Compares the generator output with the expected files, so it runs on every OS.
      - name: Test source generator
        if: ${{ !matrix.coverage }}
        run: dotnet test tests/ImageSharp.SourceGenerators.Tests/ImageSharp.SourceGenerators.Tests.csproj -c Release --no-build

      # The generator's coverage goes into the same report as the library's.
      - name: Test source generator with coverage
        if: ${{ matrix.coverage }}
        run: >
          dotnet test tests/ImageSharp.SourceGenerators.Tests/ImageSharp.SourceGenerators.Tests.csproj -c Release --no-build
          -p:codecov=true
          --collect "XPlat Code Coverage"
          --settings tests/coverlet.runsettings
          --results-directory artifacts/coverage

      - name: Test
        if: ${{ !matrix.coverage }}
        run: dotnet test tests/ImageSharp.Tests/ImageSharp.Tests.csproj -c Release --no-build

      - name: Test with coverage
        id: test-coverage
        if: ${{ matrix.coverage }}
        run: >
          dotnet test tests/ImageSharp.Tests/ImageSharp.Tests.csproj -c Release --no-build
          -p:codecov=true
          --collect "XPlat Code Coverage"
          --settings tests/coverlet.runsettings
          --results-directory artifacts/coverage

      # Writes a coverage summary to the run page and an HTML report for the artifact.
      # Reads Cobertura, not lcov, so the summary lists classes rather than file paths.
      # Runs even when tests fail, and never fails the job: the report is informational.
      # Skips if the test run wrote no coverage file, e.g. after a test host crash.
      - name: Coverage report
        if: ${{ matrix.coverage && !cancelled() && steps.test-coverage.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          shopt -s globstar nullglob
          reports=(artifacts/coverage/**/coverage.cobertura.xml)
          if (( ${#reports[@]} == 0 )); then
            echo "::warning::No coverage.cobertura.xml found, so there is no coverage report."
            exit 0
          fi
          dotnet tool restore
          dotnet reportgenerator \
            "-reports:$(IFS=';'; echo "${reports[*]}")" \
            "-targetdir:artifacts/coverage/report" \
            "-reporttypes:MarkdownSummaryGithub;Html"
          cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: ${{ matrix.coverage && !cancelled() && steps.test-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            artifacts/coverage/**/coverage.info
            artifacts/coverage/**/coverage.cobertura.xml
            artifacts/coverage/report/

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actual-output-${{ runner.os }}
          path: tests/Images/ActualOutput/

  # Builds and tests net11.0 with the .NET 11 pre-release SDK. global.json selects .NET 10 for
  # every other job, and net11.0 builds only with a .NET 11 SDK (see Directory.Build.props).
  net11:
    name: Build and test net11.0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      NET11_SDK_VERSION: 11.0.100-rc.2.26504.105
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Configure Git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer computes the version from tags.
          fetch-depth: 0

      # See https://github.com/actions/checkout/issues/165#issuecomment-657673315
      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}-v1

      - name: Pull LFS files
        run: git lfs pull

      - name: Select the .NET 11 SDK
        run: |
          cat > global.json <<EOF
          {
            "sdk": {
              "version": "$NET11_SDK_VERSION",
              "rollForward": "latestFeature",
              "allowPrerelease": true
            }
          }
          EOF

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.NET11_SDK_VERSION }}

      - name: Restore NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-net11-${{ hashFiles('Directory.Packages.props', 'nuget.config') }}-${{ env.NET11_SDK_VERSION }}
          restore-keys: ${{ runner.os }}-nuget-net11-

      - name: Build
        run: dotnet build tests/ImageSharp.Tests/ImageSharp.Tests.csproj -c Release -f net11.0

      - name: Test
        run: dotnet test tests/ImageSharp.Tests/ImageSharp.Tests.csproj -c Release --no-build -f net11.0

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actual-output-net11-${{ runner.os }}
          path: tests/Images/ActualOutput/

  # Runs the JPEG XL tests against the full conformance data and the libjxl reference tools.
  # The other legs run the same tests without them, so the data- and tool-dependent ones skip there.
  # See tests/Images/Input/Jxl/Conformance/README.md.
  jxl-oracle:
    name: JPEG XL conformance and reference tools
    runs-on: ubuntu-latest
    env:
      JXL_TOOLS_VERSION: v0.12.0
      JXL_TOOLS_ARCHIVE: jxl-linux-x86_64-static.tar.lz
      JXL_TOOLS_SHA256: 5318a1ea40adad76d023e0c17a03d4627f8282f83cb2b575e69be8e74f1ff456

    steps:
      - name: Configure Git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer computes the version from tags.
          fetch-depth: 0

      # Only the JPEG XL test data is needed from LFS: the inputs, the djxl references, the PNG and
      # TIFF inputs of the encoder's lossless corpus, the ICC profiles that the encoder tests embed, and
      # the Exif-oriented JPEG that JxlEncoderOrientationTests encodes.
      - name: Pull LFS JPEG XL test data
        run: git lfs pull --include "tests/Images/Input/Jxl/**,tests/Images/External/ReferenceOutput/JxlDecoderTests/**,tests/Images/Input/Png/**,tests/Images/Input/Tiff/**,tests/Images/Input/Icc/**,tests/Images/Input/Jpg/baseline/jpeg420exif.jpg"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'nuget.config', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The tests download the 665 MB of references by sha256 into this directory.
      # The key changes only when the vectors or the pinned source change.
      - name: Restore JPEG XL conformance cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/Images/External/Jxl/.cache
          key: jxl-conformance-${{ hashFiles('tests/Images/Input/Jxl/Conformance/**/test.json', 'tests/Images/Input/Jxl/Conformance/source.json') }}

      - name: Restore libjxl tools cache
        id: jxl-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/jxl-tools
          key: jxl-tools-${{ runner.os }}-${{ env.JXL_TOOLS_VERSION }}-${{ env.JXL_TOOLS_SHA256 }}

      # The static release tools run on any glibc version; the archive needs lzip.
      - name: Download libjxl tools
        if: ${{ steps.jxl-tools-cache.outputs.cache-hit != 'true' }}
        run: |
          sudo apt-get install -y --no-install-recommends lzip
          curl -sSfL --proto '=https' --proto-redir '=https' -o "$RUNNER_TEMP/$JXL_TOOLS_ARCHIVE" \
            "https://github.com/libjxl/libjxl/releases/download/$JXL_TOOLS_VERSION/$JXL_TOOLS_ARCHIVE"
          echo "$JXL_TOOLS_SHA256  $RUNNER_TEMP/$JXL_TOOLS_ARCHIVE" | sha256sum --check
          mkdir -p ~/jxl-tools
          lzip -dc "$RUNNER_TEMP/$JXL_TOOLS_ARCHIVE" | tar -x -C ~/jxl-tools

      # The archive's folder layout is not documented, so find the folder that holds djxl.
      - name: Locate libjxl tools
        run: |
          djxl="$(find ~/jxl-tools -type f -name djxl | head -n 1)"
          if [[ -z "$djxl" ]]; then
            echo "::error::djxl was not found in the libjxl tools archive."
            exit 1
          fi
          echo "JXL_TOOLS_DIR=$(dirname "$djxl")" >> "$GITHUB_ENV"
          "$djxl" --version

      - name: Build
        run: dotnet build tests/ImageSharp.Tests/ImageSharp.Tests.csproj -c Release

      # JXL_CONFORMANCE=1 downloads missing data and turns a skip into a failure.
      - name: Test
        env:
          JXL_CONFORMANCE: '1'
        run: dotnet test tests/ImageSharp.Tests/ImageSharp.Tests.csproj -c Release --no-build --filter "Format=Jxl"

  apicompat:
    name: Public API matches SixLabors.ImageSharp 2.1.13
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run ApiCompat
        shell: pwsh
        run: ./ci-apicompat.ps1

  # Packs every push to main so the package can be downloaded from the run and
  # tried out. Nothing here publishes.
  pack:
    name: Pack
    needs: [build, apicompat]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer computes the version from tags.
          fetch-depth: 0

      # Only the package icon is needed from LFS.
      - name: Pull LFS package icon
        run: git lfs pull --include "build/branding/*"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/ImageSharp/ImageSharp.csproj -c Release -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages/
