name: CI

# Builds, tests, and checks the public API. Publishing is separate:
# release-publish.yml (stable releases) and release-prerelease.yml (pre-releases)
# both require this workflow to have passed on the commit they publish.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            coverage: true

    steps:
      - name: Configure Git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer computes the version from tags.
          fetch-depth: 0

      # See https://github.com/actions/checkout/issues/165#issuecomment-657673315
      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}-v1

      - name: Pull LFS files
        run: git lfs pull

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'nuget.config', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Builds net10.0 and netstandard2.1 for the library; tests run on net10.0.
      - name: Build
        run: dotnet build ImageSharp.sln -c Release -p:codecov=${{ matrix.coverage == true }}

      - name: Test
        if: ${{ !matrix.coverage }}
        run: dotnet test tests/ImageSharp.Tests/ImageSharp.Tests.csproj -c Release --no-build

      - name: Test with coverage
        if: ${{ matrix.coverage }}
        run: >
          dotnet test tests/ImageSharp.Tests/ImageSharp.Tests.csproj -c Release --no-build
          -p:codecov=true
          --collect "XPlat Code Coverage"
          --settings tests/coverlet.runsettings
          --results-directory artifacts/coverage

      - name: Upload coverage
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: artifacts/coverage/**/coverage.info

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actual-output-${{ runner.os }}
          path: tests/Images/ActualOutput/

  apicompat:
    name: Public API matches SixLabors.ImageSharp 2.1.13
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run ApiCompat
        shell: pwsh
        run: ./ci-apicompat.ps1

  # Packs every push to main so the package can be downloaded from the run and
  # tried out. Nothing here publishes.
  pack:
    name: Pack
    needs: [build, apicompat]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer computes the version from tags.
          fetch-depth: 0

      # Only the package icon is needed from LFS.
      - name: Pull LFS package icon
        run: git lfs pull --include "build/branding/*"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/ImageSharp/ImageSharp.csproj -c Release -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages/
