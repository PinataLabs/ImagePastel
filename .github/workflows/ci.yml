name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            coverage: true

    steps:
      - name: Configure Git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # MinVer computes the version from tags.
          fetch-depth: 0

      # See https://github.com/actions/checkout/issues/165#issuecomment-657673315
      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}-v1

      - name: Pull LFS files
        run: git lfs pull

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'nuget.config', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Builds net10.0 and netstandard2.1 for the library; tests run on net10.0.
      - name: Build
        run: dotnet build ImageSharp.sln -c Release -p:codecov=${{ matrix.coverage == true }}

      - name: Test
        if: ${{ !matrix.coverage }}
        run: dotnet test tests/ImageSharp.Tests/ImageSharp.Tests.csproj -c Release --no-build

      - name: Test with coverage
        if: ${{ matrix.coverage }}
        run: >
          dotnet test tests/ImageSharp.Tests/ImageSharp.Tests.csproj -c Release --no-build
          -p:codecov=true
          --collect "XPlat Code Coverage"
          --settings tests/coverlet.runsettings
          --results-directory artifacts/coverage

      - name: Upload coverage
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage/**/coverage.info

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: actual-output-${{ runner.os }}
          path: tests/Images/ActualOutput/

  apicompat:
    name: Public API matches SixLabors.ImageSharp 2.1.13
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run ApiCompat
        shell: pwsh
        run: ./ci-apicompat.ps1

  pack:
    name: Pack
    needs: [build, apicompat]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # MinVer computes the version from tags.
          fetch-depth: 0

      # Only the package icon is needed from LFS.
      - name: Pull LFS package icon
        run: git lfs pull --include "build/branding/*"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/ImageSharp/ImageSharp.csproj -c Release -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/

  publish-prerelease:
    name: Publish prerelease to GitHub Packages
    needs: pack
    if: ${{ github.ref == 'refs/heads/main' && github.repository_owner == 'PinataLabs' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      # GitHub Packages does not accept symbol packages.
      - name: Push
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
          --no-symbols

  publish-release:
    name: Publish release to nuget.org
    needs: pack
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'PinataLabs' }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      # Trusted Publishing exchanges the GitHub OIDC token for a short-lived nuget.org API key.
      id-token: write
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes the matching .snupkg symbol packages alongside.
      - name: Push
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/packages/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease
