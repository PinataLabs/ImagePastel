name: Release

# Publishes one tag to nuget.org and creates its GitHub Release.
#
# The glob requires a digit after the `v`, so other tags cannot fire a release.
on:
  push:
    tags: ['v[0-9]*']
  # Called by release-publish.yml, which creates the tag and then invokes this
  # workflow directly. A tag pushed with GITHUB_TOKEN does not trigger the
  # `push: tags` trigger above, so the call has to be explicit.
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Release ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    # Protect this environment: deployments only from main and v* tags, with a required reviewer.
    environment: nuget
    permissions:
      # Creates the GitHub Release.
      contents: write
      # Trusted Publishing exchanges the GitHub OIDC token for a short-lived nuget.org API key.
      id-token: write
      # Reads the CI result for the tagged commit.
      actions: read

    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # MinVer computes the version from tags.
          fetch-depth: 0
          fetch-tags: true

      - name: Check the tag
        run: |
          sha=$(git rev-list -n 1 "$TAG")

          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$TAG points at ${sha:0:9}, which is not on main"
            exit 1
          fi

          bash .github/scripts/require-green-ci.sh "$sha"

      # Only the package icon is needed from LFS.
      - name: Pull LFS package icon
        run: git lfs pull --include "build/branding/*"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/ImageSharp/ImageSharp.csproj -c Release -o artifacts/packages

      # A mismatch means MinVer did not see the tag, which would publish a
      # pre-release-versioned package under a release tag.
      - name: Verify the package version matches the tag
        run: |
          ls -la artifacts/packages
          expected="artifacts/packages/PinataLabs.ImagePastel.${TAG#v}.nupkg"
          if [ ! -f "$expected" ]; then
            echo "::error::Expected $expected - MinVer did not version the package from $TAG"
            exit 1
          fi

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes the matching .snupkg symbol package alongside.
      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      # Notes start at the previous v2 tag, so the first release does not list the
      # whole upstream history.
      - name: Create GitHub Release
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes)

          previous=$(git describe --tags --abbrev=0 --match 'v2.*' "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            args+=(--notes-start-tag "$previous")
          fi

          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG" artifacts/packages/* "${args[@]}"
