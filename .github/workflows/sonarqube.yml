name: SonarQube

# Analyzes the solution with SonarQube Cloud (project PinataLabs_ImageSharp).
# Runs after CI and reads the OpenCover coverage that CI's ubuntu job uploads,
# so the tests run only once.
# Kept apart from ci.yml so an analysis failure never blocks a release:
# require-green-ci.sh only looks at the CI workflow.
#
# workflow_run always runs this file as it is on main, so a change to it takes
# effect only after it merges. It runs with secrets even for a pull request, so
# it analyzes only branches of this repository, never forks or Dependabot.
# Needs the SONAR_TOKEN repository secret.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Build and analyze
    runs-on: ubuntu-latest
    # A CI run that was cancelled or skipped uploaded no coverage. One whose tests
    # failed still did, so the analysis runs with what coverage there is.
    if: >-
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'dependabot[bot]'
    permissions:
      contents: read
      # Downloads the coverage artifact from the CI run.
      actions: read

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history gives SonarQube blame data for new-code detection.
          fetch-depth: 0

      # Coverlet writes absolute source paths. They match because CI's ubuntu job
      # checks out to the same directory as this job.
      - name: Download CI coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: artifacts/coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'nuget.config', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The scanner downloads its analyzers and a Java runtime into this folder.
      - name: Restore SonarQube cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # The scanner version is pinned in dotnet-tools.json.
      # The Python scripts under tests/Images make test input files. No test runs
      # them, so, like the images they make, they are left out of coverage.
      # Under workflow_run the scanner cannot detect a pull request by itself.
      - name: Begin analysis
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_HEAD: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
          PR_BASE: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::The SONAR_TOKEN secret is not set."
            exit 1
          fi
          args=()
          if [ -n "$PR_NUMBER" ]; then
            args+=(
              "/d:sonar.pullrequest.key=$PR_NUMBER"
              "/d:sonar.pullrequest.branch=$PR_HEAD"
              "/d:sonar.pullrequest.base=$PR_BASE"
            )
          fi
          dotnet tool restore
          dotnet tool run dotnet-sonarscanner begin /k:"PinataLabs_ImageSharp" /o:"pinatalabs" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="artifacts/coverage/**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/*.pdf,**/*.pptx,**/*.ttf,**/*.woff,**/*.jpg,**/*.png" \
            /d:sonar.coverage.exclusions="tests/Images/**/*.py" \
            /d:sonar.test.exclusions="**/*.pdf,**/*.pptx,**/*.ttf,**/*.woff,**/*.jpg,**/*.png" \
            "${args[@]}"

      # The scanner analyzes the C# code as it compiles, so the build runs between
      # begin and end. The tests do not run here.
      - name: Build
        run: dotnet build ImagePastel.slnx -c Release -p:codecov=true

      - name: End analysis
        run: dotnet tool run dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
