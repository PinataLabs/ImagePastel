name: SonarQube

# Analyzes the solution with SonarQube Cloud (project PinataLabs_ImageSharp),
# with test coverage of the library and the source generator from coverlet in
# OpenCover format.
# Kept apart from ci.yml so an analysis failure never blocks a release:
# require-green-ci.sh only looks at the CI workflow.
# Changes to Markdown files alone don't run it.
#
# Needs the SONAR_TOKEN repository secret. Pull requests from forks and from
# Dependabot get no secrets, so the job skips them.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Build and analyze
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history gives SonarQube blame data for new-code detection.
          fetch-depth: 0

      # The tests read their input images from LFS.
      # See https://github.com/actions/checkout/issues/165#issuecomment-657673315
      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}-v1

      - name: Pull LFS files
        run: git lfs pull

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'nuget.config', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The scanner downloads its analyzers and a Java runtime into this folder.
      - name: Restore SonarQube cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # The scanner version is pinned in dotnet-tools.json.
      # The Python scripts under tests/Images make test input files. No test runs
      # them, so, like the images they make, they are left out of coverage.
      - name: Begin analysis
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::The SONAR_TOKEN secret is not set."
            exit 1
          fi
          dotnet tool restore
          dotnet tool run dotnet-sonarscanner begin /k:"PinataLabs_ImageSharp" /o:"pinatalabs" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="artifacts/coverage/**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/*.pdf,**/*.pptx,**/*.ttf,**/*.woff,**/*.jpg,**/*.png" \
            /d:sonar.coverage.exclusions="tests/Images/**/*.py" \
            /d:sonar.test.exclusions="**/*.pdf,**/*.pptx,**/*.ttf,**/*.woff,**/*.jpg,**/*.png"

      - name: Build
        run: dotnet build ImagePastel.slnx -c Release -p:codecov=true

      # CI is what gates on the tests. Here a failure only means partial coverage,
      # so the analysis still runs.
      - name: Test source generator with coverage
        continue-on-error: true
        run: >
          dotnet test tests/ImagePastel.SourceGenerators.Tests/ImagePastel.SourceGenerators.Tests.csproj -c Release --no-build
          -p:codecov=true
          --collect "XPlat Code Coverage"
          --settings tests/coverlet.runsettings
          --results-directory artifacts/coverage

      - name: Test with coverage
        continue-on-error: true
        run: >
          dotnet test tests/ImagePastel.Tests/ImagePastel.Tests.csproj -c Release --no-build
          -p:codecov=true
          --collect "XPlat Code Coverage"
          --settings tests/coverlet.runsettings
          --results-directory artifacts/coverage

      - name: End analysis
        run: dotnet tool run dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
